unique_name: Dim Date
object_type: dimension
label: Dim Date
calculation_groups:
  - unique_name: Time calc
    label: Time calc
    calculated_members:
      - unique_name: Current
        description: The measure's value for the current dimension members in the query.
        template: Current
        use_input_metric_format: true
      - unique_name: Previous
        description: >-
          The measure value for the previous dimension member relative to the
          current dimension member.
        template: Previous
        use_input_metric_format: true
      - unique_name: Current vs Last Year
        description: Current value minus Last Year's value for the given dimension member.
        template: Current vs Last Year
        use_input_metric_format: true
      - unique_name: Moving Average 30 Period
        description: >-
          30 Period Moving Average. Periods depend on the level of evaluation.
          If requested at the Day level, this is a 30 Day Average. At the week
          level, this is a 30 week average.
        template: Moving Average 30 Period
        use_input_metric_format: true
hierarchies:
  - unique_name: Date Month Hierarchy
    label: Date Month Hierarchy
    levels:
      - unique_name: Year
      - unique_name: Month
      - unique_name: Date
level_attributes:
  - unique_name: Date
    label: Date
    contains_unique_names: false
    dataset: datecustom
    is_unique_key: false
    key_columns:
      - datekey
    name_column: date_name
    sort_column: pk_date
    time_unit: day
  - unique_name: Year
    label: Year
    contains_unique_names: false
    dataset: datecustom
    key_columns:
      - year
    name_column: year_name
    sort_column: year
    time_unit: year
  - unique_name: Month
    label: Month
    contains_unique_names: false
    dataset: datecustom
    key_columns:
      - month
      - year
    name_column: month
    sort_column: month
    time_unit: month
type: time
